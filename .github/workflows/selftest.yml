name: selftest
# Negative tests: each attack fixture under tests/attacks must FAIL to produce a VERIFIED record through the
# real pipeline (verifier/build.sh + verifier/record.py). Each attack also runs once with its defence switched
# off (test-only switches) to prove the attack is real:
#   a  build.rs fetches the Lockbox bytes, escaping a netns with `sudo nsenter`; plants them via a rust-lld shim
#      control: the pre-hardening unshare namespace (sudo available)
#   b  build.rs leaves a process that rewrites onchain.json / source_check.json / build.json in the artifact
#      control: no isolation, and the pre-hardening record trust model (legacy compare)
#   c  .cargo/config.toml linker script emits the Lockbox bytes from split decimal-array files
#      control: the cargo-config hard check demoted (isolation still on)
#   d  build.rs overwrites tari-ootle-cli and plants CARGO_HOME/bin/tari
#      control: no isolation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["verifier/**", "tests/**", ".github/workflows/selftest.yml", ".github/workflows/verify.yml"]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -I tests/test_verifier.py

  attack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: {run: {shell: bash}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {attack: a-sudo-nsenter-fetch, modes: "isolated legacy-unshare"}
          - {attack: b-rewrite-artifact-metadata, modes: "isolated control"}
          - {attack: c-cargo-config-linker, modes: "isolated allow-config"}
          - {attack: d-poison-tari-binary, modes: "isolated control"}
    steps:
      - uses: actions/checkout@v4
        with: {path: onescan, persist-credentials: false}
      - name: Prepare the build container
        run: bash onescan/verifier/build-image.sh
      - name: Run the attack (production first, then the control with the defence off)
        env: {ATTACK: "${{ matrix.attack }}", MODES: "${{ matrix.modes }}"}
        run: |
          for mode in $MODES; do
            bash onescan/tests/run_attack.sh "$ATTACK" "$mode" "$RUNNER_TEMP/w-$mode"
            python3 -I onescan/tests/assert_attack.py "$ATTACK" "$mode" "$RUNNER_TEMP/w-$mode" "$PWD/onescan"
          done
