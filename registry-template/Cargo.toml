[package]
name = "onescan_registry"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "OneScan SourceRegistry: on-chain source-verification attestations for Tari Ootle templates."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tari_template_lib = "=0.41.0"

[dev-dependencies]
tari_template_test_tooling = "=0.54.0"
serde = { version = "1", features = ["derive"] }
minicbor = { version = "2", features = ["derive", "alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 0
incremental = false

[workspace]
